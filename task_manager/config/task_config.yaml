        params: {gripper_id: 1, comport: [2, 2], position: [0, 150], speed: [0, 255], max_torque: [0, 60], block: true, timeout_ms: 10000}
      - action_type: move_pose
        params: {arm_id: "1", frame_id: base_link, target_pose: [0.8637583238097376, -0.028816892423092868, 1.054465498945953, 0.7139391509165717, 0.6977154907343159, 0.02051436626400927, 0.0553456733149355], bound_size: [0.0, 0.0, 0.0], use_config_pose: true, enable_collision_check: false, use_force_control: false, enable_move_line: true, speed: 0.35, timeout_ms: 45000}
      - parallel_actions:
