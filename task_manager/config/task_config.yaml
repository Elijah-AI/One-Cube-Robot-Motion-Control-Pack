      - action_type: move_pose
        params: {arm_id: "0", frame_id: base_link, target_pose: [0.8520276737486208, 0.04062413283428013, 0.8675115573964274, 0.7084984454064637, -0.7052231446211558, 0.02261895829822822, -0.013366071703215987], bound_size: [0.0, 0.0, 0.0], use_config_pose: true, enable_collision_check: false, use_force_control: false, enable_move_line: true, speed: 0.35, timeout_ms: 45000}
      - action_type: gripper_ctrl
        params: {gripper_id: 0, comport: [2, 2], position: [150, 0], speed: [255, 0], max_torque: [60, 0], block: true, timeout_ms: 10000}
      - action_type: move_pose
        params: {arm_id: "0", frame_id: base_link, target_pose: [0.8520276737486208, 0.04062413283428013, 1.0675115573964274, 0.7084984454064637, -0.7052231446211558, 0.02261895829822822, -0.013366071703215987], bound_size: [0.0, 0.0, 0.0], use_config_pose: true, enable_collision_check: false, use_force_control: false, enable_move_line: true, speed: 0.35, timeout_ms: 45000}
      #0.0296241328342801
      # 任务结束：双臂同时回到采集的预抓关节位，body_joint 保持 0。
      - parallel_actions:
          - action_type: move_joints
            params: {arm_id: "0", joint_name: [Joint1_L, Joint2_L, Joint3_L, Joint4_L, Joint5_L, Joint6_L, Joint7_L], position: [-0.3570031357117381, -0.9126436008072708, 0.3374029025895138, -1.8517995028984984, -0.9134245727969366, 0.9415111351802664, -0.8714162692361901], enable_collision_check: false, speed: 0.35, timeout_ms: 45000}
