node_id: 1
modbus_slave:
  listen_ip: "0.0.0.0"
  listen_port: 12000
register_map:
  task_trigger_base_addr: 40001
  task_status_base_addr: 50001
tasks:
  move_box:
    trigger_reg: 40001
    status_reg: 50001
    action_sequence:
      - action_type: move_arm
        params:
          arm_id: "arm0"
          use_planning: true
          collision_check: true
          target_pose: [535.822, 343.300, 117.851, 0.027731, -0.702962, 0.693387, -0.150793]
          use_config_pose: true
          safety_distance: [5.01, 0.01, 0.01, -5.01, 0.01, 0.01]
          avoid_obstacle: true
     
      - action_type: vision_detect
        params:
          target_obj_name: "box"
          expected_frame_id: "camera_link"
          need_6d_pose: true
          need_env_point_cloud: true
          downsample_res: 0.02
          type: 0.02
          priority: 1
      - action_type: move_arm
        params:
          arm_id: "arm0"
          use_planning: true
          collision_check: true
          target_pose: [403.817, 512.938, 197.793, 0.0798, 0.7338, 0.6693, -0.0861]
          use_config_pose: true
          safety_distance: [5.01, 0.01, 0.01, -5.01, 0.01, 0.01]
          avoid_obstacle: true
      - action_type: gripper_ctrl
        params:
          gripper_id: 0
          comport: [2, 2]
          position: [0, 0]
          speed: [30, 30]
          max_torque: [80, 80]
          block: true
          timeout_ms: 10000
      - action_type: move_arm
        params:
          arm_id: "arm0"
          use_planning: true
          collision_check: true
          target_pose: [334.171, 596.153, 187.666, 0.1472, 0.7027, 0.6943, -0.0531]
          use_config_pose: true
          safety_distance: [5.01, 0.01, 0.01, -5.01, 0.01, 0.01]
          avoid_obstacle: true
      - action_type: gripper_ctrl
        params:
          gripper_id: 0
          comport: [2, 2]
          position: [255, 255]
          speed: [30, 30]
          max_torque: [80, 80]
          block: true
          timeout_ms: 10000
      - action_type: move_arm
        params:
          arm_id: "arm0"
          use_planning: true
          collision_check: true
          target_pose: [182.956, 618.655, 244.897, -0.2207, 0.6826, 0.2037, 0.6634]
          use_config_pose: true
          safety_distance: [5.01, 0.01, 0.01, -5.01, 0.01, 0.01]
          avoid_obstacle: true
      
      
boot_task:
  self_check:
    action_sequence:
      - action_type: vision_reset
        params:
          target_obj_name: "calib_board"
          expected_frame_id: "camera_link"
          need_6d_pose: true
          need_env_point_cloud: false
          downsample_res: 0.02
          priority: 0
  reset:
    action_sequence:
      - action_type: gripper_reset
        params:
          gripper_id: 0
          comport: [2, 2]
          position: [0, 0]
          speed: [20, 20]
          max_torque: [50, 50]
          block: true
          timeout_ms: 1500