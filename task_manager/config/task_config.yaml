          - action_type: move_joints
            params: {arm_id: "4", joint_name: [leg_joint1, leg_joint2, leg_joint3, body_joint], position: [-1.0, 2.2, -1.2, 0.0], enable_collision_check: false, speed: 0.8, timeout_ms: 15000}
  # 保留原有吸盘示例任务。
  control_suck_example:
    trigger_reg: 40002
    status_reg: 50002
    action_sequencenum: 1
    action_sequence1:
      - action_type: control_suck
        params:
          suck_id: "0"
          active: [true, false]
          timeout_ms: 5000

boot_task:
  self_check:
    action_sequence:
      - action_type: vision_check_self
        params:
          timeout_ms: 15000
      - action_type: control_check_self
        params:
          comport: [2, 2]
          timeout_ms: 15000

  reset:
    action_sequence:
      - action_type: vision_reset
        params:
          timeout_ms: 15000
      - action_type: control_reset
        params:
          timeout_ms: 15000
