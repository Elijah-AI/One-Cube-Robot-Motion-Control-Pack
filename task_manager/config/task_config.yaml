          params: {arm_id: "1", joint_name: [Joint1_R, Joint2_R, Joint3_R, Joint4_R, Joint5_R, Joint6_R, Joint7_R], position: [0.6397361681014009, -0.5832027176392532, -0.8220328736686873, -1.884303783477079, 0.9503200065388943, 0.5485912108481474, 0.8430800355006652], enable_collision_check: false, speed: 0.35, timeout_ms: 45000}
        - action_type: move_joints
