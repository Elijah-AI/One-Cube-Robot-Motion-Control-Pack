node_id: 1

modbus_slave:
  listen_ip: "0.0.0.0"
  listen_port: 12000

tasks:
  # 四工位双臂抓取放置；无视觉。Move_L 通过 move_pose.enable_move_line=true 执行。
  # 第一轮：右臂 pose-1、左臂 pose-3；第二轮：右臂 pose-2、左臂 pose-4。
  # 每轮抓取按阶段双臂同时执行，放置按右臂先、左臂后的顺序执行。
  # 抓取点来自“抓取：P-1.txt”：pose-1/2 取右臂位姿，pose-3/4 取左臂位姿。
  # 放置点来自“放置.txt”：pose-1/2 取右臂位姿，pose-3/4 取左臂位姿；预放点为 z+0.20 m。
  # parallel_actions 为局部并行组：组内 Goal 同时下发，全部结束后才执行下一步。
  move_box:
    trigger_reg: 40001
    status_reg: 50001
    action_sequencenum: 1
    action_sequence1:
      # 任务初始化：先将腿部/腰部恢复到抓取侧，确保 body_joint=-1.57。
      # 双臂进入“抓取：P-1.txt”记录的预抓关节位。
      # 第一轮抓取：右臂 pose-1、左臂 pose-3；各阶段双臂同时执行。
      - parallel_actions:
          - action_type: move_joints
            params: {arm_id: "4", joint_name: [leg_joint1, leg_joint2, leg_joint3, body_joint], position: [-1.0, 2.2, -1.2, -1.37], enable_collision_check: false, speed: 0.8, timeout_ms: 15000}
          - action_type: move_joints
            params: {arm_id: "0", joint_name: [Joint1_L, Joint2_L, Joint3_L, Joint4_L, Joint5_L, Joint6_L, Joint7_L], position: [-0.3570031357117381, -0.9126436008072708, 0.3374029025895138, -1.8517995028984984, -0.9134245727969366, 0.9415111351802664, -0.8714162692361901], enable_collision_check: false, speed: 0.35, timeout_ms: 45000}
          - action_type: move_joints
            params: {arm_id: "1", joint_name: [Joint1_R, Joint2_R, Joint3_R, Joint4_R, Joint5_R, Joint6_R, Joint7_R], position: [0.6397361681014009, -0.5832027176392532, -0.8220328736686873, -1.884303783477079, 0.9503200065388943, 0.5485912108481474, 0.8430800355006652], enable_collision_check: false, speed: 0.35, timeout_ms: 45000}
          - action_type: gripper_ctrl
            params: {gripper_id: 1, comport: [2, 2], position: [0, 120], speed: [0, 255], max_torque: [0, 60], block: true, timeout_ms: 10000}
          - action_type: gripper_ctrl
            params: {gripper_id: 0, comport: [2, 2], position: [120, 0], speed: [255, 0], max_torque: [60, 0], block: true, timeout_ms: 10000}
      # 抓取预位改为 MoveP，目标与对应抓取抬升点完全一致。
      - parallel_actions:
          - action_type: move_pose
            params: {arm_id: "1", frame_id: base_link, target_pose: [0.5892883848637871, 0.40222333445507424, 1.0610234408027145, 0.007908618677328557, 0.999964740032175, -0.0012695782943420617, 0.002522025764307673], bound_size: [0.0, 0.0, 0.0], use_config_pose: true, enable_collision_check: false, use_force_control: false, enable_move_line: false, speed: 0.35, timeout_ms: 45000}
          - action_type: move_pose
            params: {arm_id: "0", frame_id: base_link, target_pose: [0.35752231689846964, 0.4075158617094619, 1.0958574044075944, 0.9999084036424457, -0.00199972610694888, -0.013298983837791246, 0.0015239585281199655], bound_size: [0.0, 0.0, 0.0], use_config_pose: true, enable_collision_check: false, use_force_control: false, enable_move_line: false, speed: 0.35, timeout_ms: 45000}
      - parallel_actions:
          - action_type: move_pose
            params: {arm_id: "1", frame_id: base_link, target_pose: [0.5892883848637871, 0.40222333445507424, 0.8110234408027145, 0.007908618677328557, 0.999964740032175, -0.0012695782943420617, 0.002522025764307673], bound_size: [0.0, 0.0, 0.0], use_config_pose: true, enable_collision_check: false, use_force_control: false, enable_move_line: true, speed: 0.35, timeout_ms: 45000}
          - action_type: move_pose
            params: {arm_id: "0", frame_id: base_link, target_pose: [0.35752231689846964, 0.4075158617094619, 0.8458574044075944, 0.9999084036424457, -0.00199972610694888, -0.013298983837791246, 0.0015239585281199655], bound_size: [0.0, 0.0, 0.0], use_config_pose: true, enable_collision_check: false, use_force_control: false, enable_move_line: true, speed: 0.35, timeout_ms: 45000}
      - parallel_actions:
          - action_type: gripper_ctrl
            params: {gripper_id: 1, comport: [2, 2], position: [0, 255], speed: [0, 255], max_torque: [0, 60], block: true, timeout_ms: 10000}
          - action_type: gripper_ctrl
            params: {gripper_id: 0, comport: [2, 2], position: [255, 0], speed: [255, 0], max_torque: [60, 0], block: true, timeout_ms: 10000}
      - parallel_actions:
          - action_type: move_pose
            params: {arm_id: "1", frame_id: base_link, target_pose: [0.5892883848637871, 0.40222333445507424, 1.0610234408027145, 0.007908618677328557, 0.999964740032175, -0.0012695782943420617, 0.002522025764307673], bound_size: [0.0, 0.0, 0.0], use_config_pose: true, enable_collision_check: false, use_force_control: false, enable_move_line: true, speed: 0.35, timeout_ms: 45000}
          - action_type: move_pose
            params: {arm_id: "0", frame_id: base_link, target_pose: [0.35752231689846964, 0.4075158617094619, 1.0958574044075944, 0.9999084036424457, -0.00199972610694888, -0.013298983837791246, 0.0015239585281199655], bound_size: [0.0, 0.0, 0.0], use_config_pose: true, enable_collision_check: false, use_force_control: false, enable_move_line: true, speed: 0.35, timeout_ms: 45000}

      # 腰部转到放置侧（body_joint=0），双臂保持已抬升状态。
      - action_type: move_joints
        params: {arm_id: "4", joint_name: [leg_joint1, leg_joint2, leg_joint3, body_joint], position: [-1.0, 2.2, -1.2, 0.0], enable_collision_check: false, speed: 0.8, timeout_ms: 15000}

      # 第一轮放置：右臂先放 pose-1，再由左臂放 pose-3。
      - action_type: move_pose
        params: {arm_id: "1", frame_id: base_link, target_pose: [0.8479058980816546, -0.06958163336625772, 1.059754675964031, 0.7140013642716687, 0.6991433193507577, 0.024978959057485633, 0.027869740397155982], bound_size: [0.0, 0.0, 0.0], use_config_pose: true, enable_collision_check: false, use_force_control: false, enable_move_line: false, speed: 0.35, timeout_ms: 45000}
      - action_type: move_pose
        params: {arm_id: "1", frame_id: base_link, target_pose: [0.8479058980816546, -0.06958163336625772, 0.859754675964031, 0.7140013642716687, 0.6991433193507577, 0.024978959057485633, 0.027869740397155982], bound_size: [0.0, 0.0, 0.0], use_config_pose: true, enable_collision_check: false, use_force_control: false, enable_move_line: true, speed: 0.35, timeout_ms: 45000}
      - action_type: gripper_ctrl
        params: {gripper_id: 1, comport: [2, 2], position: [0, 150], speed: [0, 255], max_torque: [0, 60], block: true, timeout_ms: 10000}
      - action_type: move_pose
        params: {arm_id: "1", frame_id: base_link, target_pose: [0.8479058980816546, -0.06958163336625772, 1.059754675964031, 0.7140013642716687, 0.6991433193507577, 0.024978959057485633, 0.027869740397155982], bound_size: [0.0, 0.0, 0.0], use_config_pose: true, enable_collision_check: false, use_force_control: false, enable_move_line: true, speed: 0.35, timeout_ms: 45000}
      - parallel_actions:
        - action_type: move_joints
          params: {arm_id: "1", joint_name: [Joint1_R, Joint2_R, Joint3_R, Joint4_R, Joint5_R, Joint6_R, Joint7_R], position: [0.6397361681014009, -0.5832027176392532, -0.8220328736686873, -1.884303783477079, 0.9503200065388943, 0.5485912108481474, 0.8430800355006652], enable_collision_check: false, speed: 0.35, timeout_ms: 45000}
        - action_type: move_joints
          params: {arm_id: "4", joint_name: [leg_joint1, leg_joint2, leg_joint3, body_joint], position: [-1.0, 2.2, -1.2, 0.4], enable_collision_check: false, speed: 0.8, timeout_ms: 15000}
      - action_type: move_pose
        params: {arm_id: "0", frame_id: base_link, target_pose: [0.849704152321697, 0.0089748852174621898, 1.0633194955169481, 0.7080667363643175, -0.7059446817562889, 0.010155842054073355, -0.013433615543428786], bound_size: [0.0, 0.0, 0.0], use_config_pose: true, enable_collision_check: false, use_force_control: false, enable_move_line: false, speed: 0.35, timeout_ms: 45000}
      - action_type: move_pose
        params: {arm_id: "0", frame_id: base_link, target_pose: [0.849704152321697, 0.0089748852174621898, 0.8633194955169481, 0.7080667363643175, -0.7059446817562889, 0.010155842054073355, -0.013433615543428786], bound_size: [0.0, 0.0, 0.0], use_config_pose: true, enable_collision_check: false, use_force_control: false, enable_move_line: true, speed: 0.35, timeout_ms: 45000}
      - action_type: gripper_ctrl
        params: {gripper_id: 0, comport: [2, 2], position: [150, 0], speed: [255, 0], max_torque: [60, 0], block: true, timeout_ms: 10000}
      - action_type: move_pose
        params: {arm_id: "0", frame_id: base_link, target_pose: [0.849704152321697, 0.0089748852174621898, 1.0633194955169481, 0.7080667363643175, -0.7059446817562889, 0.010155842054073355, -0.013433615543428786], bound_size: [0.0, 0.0, 0.0], use_config_pose: true, enable_collision_check: false, use_force_control: false, enable_move_line: true, speed: 0.35, timeout_ms: 45000}
      #-0.0029748852174621898
      # 第二轮抓取：将腰部恢复到抓取侧。右臂 pose-2、左臂 pose-4；各阶段双臂同时执行。
      - parallel_actions:
          - action_type: move_joints
            params: {arm_id: "4", joint_name: [leg_joint1, leg_joint2, leg_joint3, body_joint], position: [-1.0, 2.2, -1.2, -1.57], enable_collision_check: false, speed: 0.8, timeout_ms: 15000}
          - action_type: gripper_ctrl
            params: {gripper_id: 1, comport: [2, 2], position: [0, 100], speed: [0, 255], max_torque: [0, 60], block: true, timeout_ms: 10000}
          - action_type: gripper_ctrl
            params: {gripper_id: 0, comport: [2, 2], position: [120, 0], speed: [255, 0], max_torque: [60, 0], block: true, timeout_ms: 10000}
      # 抓取预位改为 MoveP，目标与对应抓取抬升点完全一致。
      - parallel_actions:
          - action_type: move_pose
            params: {arm_id: "1", frame_id: base_link, target_pose: [0.5204827605553153, 0.4056060309702072, 1.0717764117474336, -0.03718022364988024, 0.9989343476897845, -0.022431486575720406, 0.015640600529803803], bound_size: [0.0, 0.0, 0.0], use_config_pose: true, enable_collision_check: false, use_force_control: false, enable_move_line: false, speed: 0.35, timeout_ms: 45000}
          - action_type: move_pose
            params: {arm_id: "0", frame_id: base_link, target_pose: [0.26552412986432467, 0.4118776840913863, 1.0721877077224846, 0.9997810180368611, 0.012582149119897792, 0.0016212844505930485, -0.01664262399481089], bound_size: [0.0, 0.0, 0.0], use_config_pose: true, enable_collision_check: false, use_force_control: false, enable_move_line: false, speed: 0.35, timeout_ms: 45000}
      - parallel_actions:
          - action_type: move_pose
            params: {arm_id: "1", frame_id: base_link, target_pose: [0.5204827605553153, 0.4056060309702072, 0.8067764117474336, -0.03718022364988024, 0.9989343476897845, -0.022431486575720406, 0.015640600529803803], bound_size: [0.0, 0.0, 0.0], use_config_pose: true, enable_collision_check: false, use_force_control: false, enable_move_line: true, speed: 0.35, timeout_ms: 45000}
          - action_type: move_pose
            params: {arm_id: "0", frame_id: base_link, target_pose: [0.26552412986432467, 0.4118776840913863, 0.8221877077224846, 0.9997810180368611, 0.012582149119897792, 0.0016212844505930485, -0.01664262399481089], bound_size: [0.0, 0.0, 0.0], use_config_pose: true, enable_collision_check: false, use_force_control: false, enable_move_line: true, speed: 0.35, timeout_ms: 45000}
      - parallel_actions:
          - action_type: gripper_ctrl
            params: {gripper_id: 1, comport: [2, 2], position: [0, 255], speed: [0, 255], max_torque: [0, 60], block: true, timeout_ms: 10000}
          - action_type: gripper_ctrl
            params: {gripper_id: 0, comport: [2, 2], position: [255, 0], speed: [255, 0], max_torque: [60, 0], block: true, timeout_ms: 10000}
      - parallel_actions:
          - action_type: move_pose
            params: {arm_id: "1", frame_id: base_link, target_pose: [0.5204827605553153, 0.4056060309702072, 1.0997764117474336, -0.03718022364988024, 0.9989343476897845, -0.022431486575720406, 0.015640600529803803], bound_size: [0.0, 0.0, 0.0], use_config_pose: true, enable_collision_check: false, use_force_control: false, enable_move_line: true, speed: 0.35, timeout_ms: 45000}
          - action_type: move_pose
            params: {arm_id: "0", frame_id: base_link, target_pose: [0.26552412986432467, 0.4118776840913863, 1.0921877077224846, 0.9997810180368611, 0.012582149119897792, 0.0016212844505930485, -0.01664262399481089], bound_size: [0.0, 0.0, 0.0], use_config_pose: true, enable_collision_check: false, use_force_control: false, enable_move_line: true, speed: 0.35, timeout_ms: 45000}

      # 腰部再次转到放置侧（body_joint=0）。
      - action_type: move_joints
        params: {arm_id: "4", joint_name: [leg_joint1, leg_joint2, leg_joint3, body_joint], position: [-1.0, 2.2, -1.2, -0.4], enable_collision_check: false, speed: 0.8, timeout_ms: 15000}

      # 第二轮放置：右臂先放 pose-2，再由左臂放 pose-4。
      - action_type: move_pose
        params: {arm_id: "1", frame_id: base_link, target_pose: [0.8637583238097376, -0.028816892423092868, 1.054465498945953, 0.7139391509165717, 0.6977154907343159, 0.02051436626400927, 0.0553456733149355], bound_size: [0.0, 0.0, 0.0], use_config_pose: true, enable_collision_check: false, use_force_control: false, enable_move_line: false, speed: 0.35, timeout_ms: 45000}
      - action_type: move_pose
        params: {arm_id: "1", frame_id: base_link, target_pose: [0.8637583238097376, -0.028816892423092868, 0.854465498945953, 0.7139391509165717, 0.6977154907343159, 0.02051436626400927, 0.0553456733149355], bound_size: [0.0, 0.0, 0.0], use_config_pose: true, enable_collision_check: false, use_force_control: false, enable_move_line: true, speed: 0.35, timeout_ms: 45000}
