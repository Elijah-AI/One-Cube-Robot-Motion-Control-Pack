      timeout_ms: 45000

  # 43a. 左臂放置前，腰部先到绝对0.3 rad；三个腿关节保持当前反馈，双臂随腰转动。
  - action_type: move_joints
    params:
      arm_id: 4
      joint_name: [body_joint]
