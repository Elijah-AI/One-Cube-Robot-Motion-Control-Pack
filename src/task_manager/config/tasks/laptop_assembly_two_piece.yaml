      speed: [255, 255]
      max_torque: [0, 60]
      block: true
      timeout_ms: 10000

  # 42a. 松爪完成后，腰部固定，右臂 MoveP 沿 tray 视觉局部-Y移动3 cm，局部X/Z及姿态保持不变。
  - action_type: move_pose
    params:
      arm_id: 1
      vision_result_key: tray
      frame_id: base_link
      use_config_pose: false
      target_pose: *unused_pose
      bound_size: *zero_offset
      vision_pose_offset:
        translation_frame: vision
        force_vertical_down: true  # TCP Z强制对齐base_link -Z，保留水平开合朝向
        translation: [0.205, &right_place_clear_y_round3 0.086, 0.08]  # right_place_y_round3 - 0.030 m
        rotation: *right_place_rotation
      enable_collision_check: 1
      use_force_control: false
      enable_move_line: false
      speed: 0.8
      timeout_ms: 45000

  # 43. 腰部固定，右臂保持松爪后偏移的Y，MoveL沿视觉+Z退出到上方20 cm。
