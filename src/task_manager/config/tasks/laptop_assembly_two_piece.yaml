      speed: 0.9
      timeout_ms: 60000

  # 44. 腰部固定，仅左臂 MoveP 到 tray 第6槽上方，目标保持该臂当前TCP基座高度，腿部和腰部不参与规划。
  - action_type: move_pose
    delay_ms: 50  # 左臂MoveP规划前等待0.2秒
    params:
      arm_id: 0
      vision_result_key: tray
      frame_id: base_link
      use_config_pose: false
      target_pose: *unused_pose
      bound_size: *zero_offset
      vision_pose_offset:
        translation_frame: vision
        force_vertical_down: true  # TCP Z强制对齐base_link -Z，保留水平开合朝向
        translation: [0.205, &left_place_y_round3 0.139, current_tcp_height]
        minimum_z: 0.10  # 当前高度须高于放置终点，随后沿视觉Z下降
        rotation: &left_place_rotation_slot6 [0.708955557081, 0.705253158862, 0, 0]  # 绕视觉局部 Z 轴旋转180度，仅改变TCP姿态
      enable_collision_check: 1
      use_force_control: false
      enable_move_line: false
      speed: 0.8
      timeout_ms: 60000

  # 45. 腰部固定，左臂 MoveL 直线下降到 tray 第6槽上方 10 cm，腿部和腰部保持当前角度。
  - action_type: move_pose
