# 笔记本组装件三轮六件：左5→2/右10→1；左6→4/右11→3；左4→6/右9→5；三轮均右手先放、左手后放。
# 单位 m / rad，四元数 xyzw；视觉输入均为真实 base_link 位姿。
# 以 0.530 m 内长、0.025 m 槽宽、14 槽对称布局为准：
# pitch=(0.530-0.025)/13；y(slot)=(7.5-slot)*pitch，槽序沿 rack -Y。
# 视觉 -Z 是深入方向；TCP +Z 对齐视觉 -Z，开合轴 TCP X 对齐视觉 X/Y。
# 抓取rack先统一局部+Y朝向base_link -X；所有translation沿修正后的视觉局部轴。
# 放置tray补偿：保留视觉局部Y整体-0.010 m；2026-09-29追加各槽局部Y实测修正。
# “初始修正”前槽1..6累计追加补偿：[+0.011, -0.004, +0.009, -0.010, +0.015, -0.001] m。
# “初始修正”（本次视觉局部Y增量，槽1..6）：[-0.006, +0.004, 0.000, +0.008, -0.010, -0.002] m。
# 含“初始修正”的累计追加补偿：[+0.005, 0.000, +0.009, -0.002, +0.005, -0.003] m；已合入锚点，勿重复叠加。
# 以下槽位偏移相对真实右下角；单位m，槽序1..6，沿视觉局部+Y：
# 槽号：                     1       2       3       4       5       6
# 相对真实右下角Y：        0.018   0.044   0.0663  0.097   0.127   0.153
# 相对原始视觉右下角Y：    0.013   0.034   0.0793  0.072   0.123   0.140
# 第4、5、6槽已在原标定值上沿视觉+Y各增加0.004 m（0.4 cm）。
# 六槽名义位置沿用实测标定；历史命令见doc/RACK_SLOT_CENTER_MOVE_P_20260928.md，当前整体补偿以下方为准。
# 2026-09-30累计放置新增视觉局部Y偏移：第3槽+0.014、第4槽-0.013、第5槽+0.001 m；已合入下方锚点。
# 本次在现值上继续沿视觉局部-Y调整：第3槽0.008 m、第5槽0.015 m；侧移与上提同步调整。
# 最终translation.y = 槽位Y - 0.010 + 各槽追加补偿 + 2026-09-30新增偏移；勿重复补偿。
# 各轮放置Y（左/右）：第1轮0.034/0.013，第2轮0.072/0.0793，第3轮0.140/0.123；同槽接近、下降复用放置锚点。
# 放置松爪到200后，固定腰部单臂MoveP沿视觉-Y偏移0.030 m（第3槽0.040 m）；随后保持偏移后的Y，MoveL上提到视觉Z+0.20 m。
# 松爪后MoveP与上提复用clear_y锚点；第3槽clear_y=place_y-0.040，其余槽clear_y=place_y-0.030。
# 详细参数与限制见 doc/LAPTOP_ASSEMBLY_TASK.md。
action_sequencenum: 1
action_sequence1:
  # init / 0. 腰腿恢复原默认姿态与双臂到起始姿态并行；全部完成后检测 tray。
  - parallel_actions:
      # 原有腰腿初始化合入此处，腰部回零仅执行一次。
      - action_type: move_joints
        params:
          arm_id: 4
          control_mode: 0
          joint_name: [leg_joint1, leg_joint2, leg_joint3, body_joint]
          position: [-1.0, 2.2, -1.2258046865463257, 0.0]
          relative_position: false
          enable_collision_check: 1
          speed: 0.9
          timeout_ms: 60000

      # 用户给定左臂角度转为弧度；右臂按 [-,+,-,+,-,+,-] 镜像。
      # 左臂 degree: [-52.781, -29.050, 76.789, -74.404, 142.166, -1.357, 3.654]
      # 右臂 degree: [52.781, -29.050, -76.789, -74.404, -142.166, -1.357, -3.654]
      - action_type: move_joints
        params:
          arm_id: 2
          left_joint_name: [Joint1_L, Joint2_L, Joint3_L, Joint4_L, Joint5_L, Joint6_L, Joint7_L]
          right_joint_name: [Joint1_R, Joint2_R, Joint3_R, Joint4_R, Joint5_R, Joint6_R, Joint7_R]
          left_position: [-0.921202232495127, -0.5070181477043527, 1.3402208793139256, -1.2985947766538608, 2.4812647843902584, -0.02368411794956305, 0.0637743308678728]
          right_position: [0.921202232495127, -0.5070181477043527, -1.3402208793139256, -1.2985947766538608, -2.4812647843902584, -0.02368411794956305, -0.0637743308678728]
          synchronization_mode: 0
          enable_collision_check: 1
          speed: 0.8
          timeout_ms: 60000

  # 1. 初始面向放置处，检测并保存 tray 右下角；后续 rack 检测不会覆盖它。
  - action_type: vision_detect
    delay_ms: 50  # 视觉识别前等待0.8秒
    params:
      target_obj_name: tray
      result_key: tray
      expected_frame_id: base_link
      priority: 10
      type: 0
      require_single_target: true
      require_expected_frame: true

  # 2、5. 转向抓取侧与双爪预置并行；全部完成后检测 rack。
  - parallel_actions:
      # 2. J4 相对当前反馈转动 -pi/2；当前 URDF 腰轴朝下，对应俯视逆时针。
      # task_manager 读取新鲜、静止的腰腿反馈，补全三个腿部保持目标。
      - action_type: move_joints
        params:
          arm_id: 4
          joint_name: [body_joint]
          position: [-1.5707963267948966]
          relative_position: true
          enable_collision_check: 1
          speed: 0.9
          timeout_ms: 60000

      # 5. 双爪张开至 140，数组顺序 [左,右]。
      - action_type: gripper_ctrl
        params:
          gripper_id: 2
          comport: [2, 2]
          position: [140, 140]
          speed: [255, 255]
          max_torque: [60, 60]
          block: true
          timeout_ms: 10000

  # 3. 面向抓取处，检测并保存 rack 上表面中心。
  - action_type: vision_detect
    delay_ms: 50  # 视觉识别前等待2.5秒
    params:
      target_obj_name: rack
      result_key: rack
      expected_frame_id: base_link
      # 统一托盘+Y朝向基座-X，消除绕局部Z的180度歧义；槽位和TCP姿态一起修正。
      canonical_y_direction: [-1, 0, 0]
      canonical_y_min_alignment: 0.5
      priority: 10
      type: 0
      require_single_target: true
      require_expected_frame: true

  # 4. 双臂同步进入预抓准备关节姿态：右臂采用用户给定角度，左臂按URDF镜像。
  # 镜像符号（Joint1..7）：[-1, +1, -1, +1, -1, +1, -1]。
  - action_type: move_joints
    params:
      arm_id: 2
      left_joint_name: &left_joints [Joint1_L, Joint2_L, Joint3_L, Joint4_L, Joint5_L, Joint6_L, Joint7_L]
      right_joint_name: &right_joints [Joint1_R, Joint2_R, Joint3_R, Joint4_R, Joint5_R, Joint6_R, Joint7_R]
      left_position: &left_ready [-0.8782693150902637, -0.8160107340747184, 1.0150617189548297, -1.2830104788690264, 1.9445632626203564, -0.10502339709582084, 1.1592665656604402]
      right_position: &right_ready [0.8782693150902637, -0.8160107340747184, -1.0150617189548297, -1.2830104788690264, -1.9445632626203564, -0.10502339709582084, -1.1592665656604402]
      synchronization_mode: 0
      enable_collision_check: 1
      speed: 0.8
      timeout_ms: 45000

  # 6. 双臂 + 腰部 J4 WBC MoveP 到各自抓取点上表面上方 2 cm，三个腿部保持起始角度。
  - action_type: move_pose
    params:
      arm_id: 7
      whole_body_waist_only: true
      vision_result_key: rack
      frame_id: base_link
      use_config_pose: false
      left_target_pose: &unused_pose [0, 0, 0, 0, 0, 0, 1]
      right_target_pose: *unused_pose
      left_bound_size: &zero_offset [0, 0, 0]
      right_bound_size: *zero_offset
      left_vision_pose_offset:
        translation_frame: vision
        # 左臂实测偏向槽序负方向 8 mm；沿槽序正方向补偿，即视觉局部 Y -0.008 m。
        translation: [0, &left_pick_y 0.08911538461538462, 0.02]
        # 左臂匹配预抓分支：TCP X -> 视觉 +Y，TCP Y -> 视觉 +X，TCP Z -> 视觉 -Z。
        # q_tcp = q_vision * q_offset。
        rotation: &left_pick_rotation [0.7071067811865476, 0.7071067811865476, 0, 0]
      right_vision_pose_offset:
        translation_frame: vision
        translation: [0, &right_pick_y -0.09711538461538462, 0.02]
        # 右臂匹配预抓分支：TCP X -> 视觉 -Y，TCP Y -> 视觉 -X，TCP Z -> 视觉 -Z。
        rotation: &right_pick_rotation [0.7071067811865476, -0.7071067811865476, 0, 0]
      synchronization_mode: 0
      enable_collision_check: 1
      use_force_control: false
      enable_move_line: false
      speed: 0.8
      timeout_ms: 60000

  # 7. 双臂同步抓取下降：左臂Z=-0.17 m，右臂Z=-0.18 m。
  - action_type: move_pose
    params:
      arm_id: 2
      vision_result_key: rack
      frame_id: base_link
      use_config_pose: false
      left_target_pose: *unused_pose
      right_target_pose: *unused_pose
      left_bound_size: *zero_offset
      right_bound_size: *zero_offset
      left_vision_pose_offset:
        translation_frame: vision
        translation: [0, *left_pick_y, -0.1585]
        rotation: *left_pick_rotation
      right_vision_pose_offset:
        translation_frame: vision
        translation: [0, *right_pick_y, -0.18]
        rotation: *right_pick_rotation
      synchronization_mode: 0
      enable_collision_check: 1
      use_force_control: false
      enable_move_line: true
      speed: 0.4
      timeout_ms: 60000

  # 8. 双爪夹紧并等待完成。
  - action_type: gripper_ctrl
    params:
      gripper_id: 2
      comport: [2, 2]
      position: [255, 255]
      speed: [255, 255]
      max_torque: [110, 120]
      block: true
      timeout_ms: 10000

  # 9. 夹紧完成后，双臂＋J4 WBC MoveP 到上表面上方 13 cm。
  - action_type: move_pose
    ik_failure_recovery:
      key: post_grasp_round_1
      lift_m: 0.05
      speed: 0.10
      timeout_ms: 30000
      enable_collision_check: 1
    params:
      arm_id: 7
      whole_body_waist_only: true
      vision_result_key: rack
      frame_id: base_link
      use_config_pose: false
      left_target_pose: *unused_pose
      right_target_pose: *unused_pose
      left_bound_size: *zero_offset
      right_bound_size: *zero_offset
      left_vision_pose_offset:
        translation_frame: vision
        translation: [0, *left_pick_y, 0.13]
        rotation: *left_pick_rotation
      right_vision_pose_offset:
        translation_frame: vision
        translation: [0, *right_pick_y, 0.13]
        rotation: *right_pick_rotation
      synchronization_mode: 0
      enable_collision_check: 1
      use_force_control: false
      enable_move_line: false
      speed: 0.6
      timeout_ms: 60000

  # 9a. 仅 IK 恢复分支先转至绝对-0.3 rad，正常分支与后续腿部前伸合并；三个腿关节保持当前反馈，双臂随腰转动。
  - action_type: move_joints
    if_recovery_applied: post_grasp_round_1
    params:
      arm_id: 4
      joint_name: [body_joint]
      position: [-0.3]
      relative_position: false
      enable_collision_check: 1
      speed: 0.9
      timeout_ms: 60000

  # IK 恢复升腿后，转身完成才回降 5 cm；正常分支跳过。
  - action_type: move_joints
    if_recovery_applied: post_grasp_round_1
    params:
      arm_id: 4
      leg_motion_mode: vertical_relative
      body_height_m: -0.05
      enable_collision_check: 1
      speed: 0.8
      timeout_ms: 30000

  # 9b. 腰转至-0.3 rad与腿部前伸共用同一轨迹；leg3补偿保持腿部俯仰姿态。
  - action_type: move_joints
    params:
      arm_id: 4
      control_mode: 0
      joint_name: [leg_joint1, leg_joint2, body_joint]
      position: [-0.65, 2.0, -0.3]
      relative_position: false
      enable_collision_check: 1
      speed: 0.9
      timeout_ms: 60000

  # 10. 腰部固定，仅右臂 MoveP 到 tray 第1槽上方，目标保持该臂当前TCP基座高度，腿部和腰部不参与规划。
  - action_type: move_pose
    delay_ms: 50  # 右臂MoveP规划前等待0.2秒
    params:
      arm_id: 1
      vision_result_key: tray
      frame_id: base_link
      use_config_pose: false
      target_pose: *unused_pose
      bound_size: *zero_offset
      vision_pose_offset:
        translation_frame: vision
        force_vertical_down: true  # TCP Z强制对齐base_link -Z，保留水平开合朝向
        translation: [0.205, &right_place_y 0.01, current_tcp_height]
        minimum_z: 0.10  # 当前高度须高于放置终点，随后沿视觉Z下降
        rotation: &right_place_rotation_slot1 [0.7027741455, -0.7114130308, 0, 0]  # 绕视觉局部 Z 轴旋转180度，仅改变TCP姿态
      enable_collision_check: 1
      use_force_control: false
      enable_move_line: false
      speed: 0.8
      timeout_ms: 60000

  # 11. 腰部固定，右臂 MoveL 直线下降到 tray 第1槽上方 10 cm，腿部和腰部保持当前角度。
  - action_type: move_pose
    delay_ms: 50  # 直线下降规划前等待0.2秒
    params:
      arm_id: 1
      vision_result_key: tray
      frame_id: base_link
      use_config_pose: false
      target_pose: *unused_pose
      bound_size: *zero_offset
      vision_pose_offset:
        translation_frame: vision
        force_vertical_down: true  # TCP Z强制对齐base_link -Z，保留水平开合朝向
        translation: [0.205, *right_place_y, 0.058]
        rotation: *right_place_rotation_slot1
      enable_collision_check: 1
      use_force_control: false
      enable_move_line: true
      speed: 0.4
      timeout_ms: 60000

  # 12. 右爪松开至 150。
  - action_type: gripper_ctrl
    params:
      gripper_id: 1
      comport: [2, 2]
      position: [0, 150]
      speed: [255, 255]
      max_torque: [0, 60]
      block: true
      timeout_ms: 10000

  # 12a. 松爪完成后，腰部固定，右臂 MoveP 沿 tray 视觉局部-Y移动3 cm，局部X/Z及姿态保持不变。
  - action_type: move_pose
    params:
      arm_id: 1
      vision_result_key: tray
      frame_id: base_link
      use_config_pose: false
      target_pose: *unused_pose
      bound_size: *zero_offset
      vision_pose_offset:
        translation_frame: vision
        force_vertical_down: true  # TCP Z强制对齐base_link -Z，保留水平开合朝向
        translation: [0.205, &right_place_clear_y -0.022, 0.08]  # right_place_y - 0.030 m
        rotation: *right_place_rotation_slot1
      enable_collision_check: 1
      use_force_control: false
      enable_move_line: false
      speed: 0.8
      timeout_ms: 45000

  # 13. 腰部固定，右臂保持松爪后偏移的Y，MoveL沿视觉+Z退出到上方20 cm。
  - action_type: move_pose
    params:
      arm_id: 1
      vision_result_key: tray
      frame_id: base_link
      use_config_pose: false
      target_pose: *unused_pose
      bound_size: *zero_offset
      vision_pose_offset:
        translation_frame: vision
        force_vertical_down: true  # TCP Z强制对齐base_link -Z，保留水平开合朝向
        translation: [0.205, *right_place_clear_y, 0.20]
        rotation: *right_place_rotation_slot1
      enable_collision_check: 1
      use_force_control: false
      enable_move_line: true
      speed: 0.8
      timeout_ms: 45000


  # 13a. 左臂放置前，腰部先到绝对0.3 rad；三个腿关节保持当前反馈，双臂随腰转动。
  - action_type: move_joints
    params:
      arm_id: 4
      joint_name: [body_joint]
      position: [0.3]
      relative_position: false
      enable_collision_check: 1
      speed: 0.9
      timeout_ms: 60000

  # 14. 腰部固定，仅左臂 MoveP 到 tray 第2槽上方，目标保持该臂当前TCP基座高度，腿部和腰部不参与规划。
  - action_type: move_pose
    delay_ms: 50  # 左臂MoveP规划前等待0.2秒
    params:
      arm_id: 0
      vision_result_key: tray
      frame_id: base_link
      use_config_pose: false
      target_pose: *unused_pose
      bound_size: *zero_offset
      vision_pose_offset:
        translation_frame: vision
        force_vertical_down: true  # TCP Z强制对齐base_link -Z，保留水平开合朝向
        translation: [0.205, &left_place_y 0.029, current_tcp_height]
        minimum_z: 0.10  # 当前高度须高于放置终点，随后沿视觉Z下降
        rotation: &left_place_rotation [0.7071067811865476, 0.7071067811865476, 0, 0]  # 绕视觉局部 Z 轴旋转180度，仅改变TCP姿态
      enable_collision_check: 1
      use_force_control: false
      enable_move_line: false
      speed: 0.8
      timeout_ms: 60000

  # 15. 腰部固定，左臂 MoveL 直线下降到 tray 第2槽上方 10 cm，腿部和腰部保持当前角度。
  - action_type: move_pose
    delay_ms: 50  # 直线下降规划前等待0.2秒
    params:
      arm_id: 0
      vision_result_key: tray
      frame_id: base_link
      use_config_pose: false
      target_pose: *unused_pose
      bound_size: *zero_offset
      vision_pose_offset:
        translation_frame: vision
        force_vertical_down: true  # TCP Z强制对齐base_link -Z，保留水平开合朝向
        translation: [0.205, *left_place_y, 0.06]
        rotation: *left_place_rotation
      enable_collision_check: 1
      use_force_control: false
      enable_move_line: true
      speed: 0.4
      timeout_ms: 60000

  # 16. 左爪松开至 150。
  - action_type: gripper_ctrl
    params:
      gripper_id: 0
      comport: [2, 2]
      position: [140, 0]
      speed: [255, 255]
      max_torque: [60, 0]
      block: true
      timeout_ms: 10000

  # 16a. 松爪完成后，腰部固定，左臂 MoveP 沿 tray 视觉局部-Y移动3 cm，局部X/Z及姿态保持不变。
  - action_type: move_pose
    params:
      arm_id: 0
      vision_result_key: tray
      frame_id: base_link
      use_config_pose: false
      target_pose: *unused_pose
      bound_size: *zero_offset
      vision_pose_offset:
        translation_frame: vision
        force_vertical_down: true  # TCP Z强制对齐base_link -Z，保留水平开合朝向
        translation: [0.205, &left_place_clear_y -0.008, 0.08]  # left_place_y - 0.037 m
        rotation: *left_place_rotation
      enable_collision_check: 1
      use_force_control: false
      enable_move_line: false
      speed: 0.8
      timeout_ms: 45000

  # 17. 腰部固定，左臂保持松爪后偏移的Y，MoveL沿视觉+Z退出到上方20 cm。
  - action_type: move_pose
    params:
      arm_id: 0
      vision_result_key: tray
      frame_id: base_link
      use_config_pose: false
      target_pose: *unused_pose
      bound_size: *zero_offset
      vision_pose_offset:
        translation_frame: vision
        force_vertical_down: true  # TCP Z强制对齐base_link -Z，保留水平开合朝向
        translation: [0.205, *left_place_clear_y, 0.20]
        rotation: *left_place_rotation
      enable_collision_check: 1
      use_force_control: false
      enable_move_line: true
      speed: 0.8
      timeout_ms: 45000

  # 第2轮：左抓6→tray第4槽；右抓11→tray第3槽，仍先放右臂；复用首轮rack/tray缓存。
  # 18、17a、夹爪预置：双臂、腰腿、夹爪三项并行；全部完成后再接近抓取点。
  - parallel_actions:
      # 18. 双臂回原预抓取关节位，与腰腿协调后退转身、双爪预置并行。
      - action_type: move_joints
        params:
          arm_id: 2
          left_joint_name: *left_joints
          right_joint_name: *right_joints
          left_position: *left_ready
          right_position: *right_ready
          synchronization_mode: 0
          enable_collision_check: 1
          speed: 0.9
          timeout_ms: 45000

