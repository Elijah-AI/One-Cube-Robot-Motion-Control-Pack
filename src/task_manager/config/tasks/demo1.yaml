  #     suck_id: 0
  #     active: [true, true]
  #     timeout_ms: 5000
  # - action_type: move_pose
  #   delay_ms: 0                      # 执行前延迟时间（毫秒），0 表示不延迟
  #   params:
  #     arm_id: 1
  #     frame_id: "base_link"
  #     enable_collision_check: 0
  #     use_config_pose: true
  #     target_pose: [0.096057, 0.048681, 0.81900, -0.895291, -0.164696, 0.407321, -0.0736177]
