# 单个任务的动作列表（触发寄存器与状态寄存器见主配置 task_config.yaml）
# 本文件由主配置 tasks.move_box.config_file 外链加载（相对主配置目录解析）
action_sequencenum: 1
action_sequence1:
 
  - action_type: move_joints
    delay_ms: 0                    # 执行前延迟时间（毫秒），0 表示不延迟
    params:
      arm_id: 4
      joint_name: ['leg_joint1','leg_joint2','leg_joint3','body_joint']
      position: [1.4, 2.9, -1.3, 0]
      synchronization_mode: 0
      enable_collision_check: 0
      speed: 0.2
      timeout_ms: 30000
  - action_type: move_joints
    delay_ms: 1                    # 执行前延迟时间（毫秒），0 表示不延迟
    params:
      arm_id: 1
      joint_name: ['Joint1_R','Joint2_R','Joint3_R','Joint4_R', 'Joint5_R','Joint6_L','Joint7_L']
      position: [-1.7, -1.2, 1.7, -1.6, 0.0, 0.0, 0.0]
      synchronization_mode: 0
      enable_collision_check: 0
      speed: 0.2
      timeout_ms: 30000
  - action_type: move_pose
    delay_ms: 0                      # 执行前延迟时间（毫秒），0 表示不延迟
    params:
      arm_id: 1
      frame_id: "base_link"
      enable_collision_check: 0
      use_config_pose: true
      target_pose: [0.9398, -0.2633, 0.4571, 1, 0, 0, 0]
      bound_size: [0.0, 0.0, 0.0]
      use_force_control: false
      speed: 0.5
      hand_action_type: []
      timeout_ms: 5000
  # - action_type: control_suck
  #   delay_ms: 500                    # 执行前延迟时间（毫秒），示例：0.5 秒后执行
  #   # ===== 结果分支演示（on_failure，取消注释即生效）=====
  #   # 吸盘吸气失败时执行补偿动作：先关闭吸气泵（恢复），全部成功则本动作转为成功、主序列继续。
