# 自动标定任务动作列表（触发寄存器与状态寄存器见主配置 task_config.yaml）
# 本文件由主配置 tasks.auto_calibrate.config_file 外链加载（相对主配置目录解析）
#
# 流程（由 task_manager 后台线程自动编排）：
#   0. HEAD_MOVE（可选）    —— 自动标定开始时先将头部 move_joints 到指定位置（head_move_enable=true 时）
#   1. CHECK_STATUS         —— 请求标定：检查相机数据是否就绪并锁定 arm_id
#   2. 按顺序取前 sample_num 组 —— 从下方 pose_pool 取前 12 组（保持配置顺序）
#   3. 循环 sample_num 次    —— move_joints 单右臂关节空间到位(arm_id=1) → 等待 post_move_delay_ms → TRIGGER_CAPTURE 采集
#   4. EXECUTE_CALIBRATION  —— 通知视觉节点执行标定计算（mode=TO_HAND）
#
# 说明：
# - 每组数据为 7 个浮点：7 个关节角（单位 rad，顺序对应 joint_name / 默认关节名）
# - joint_name 可选：配置 7 个关节名；省略时按 arm_id 自动取默认名
#   （右臂 Joint1_R..Joint7_R，左臂 Joint1_L..Joint7_L）
# - 以下为通用示例值，实际部署请按标定目标替换为真实关节角序列；
#   pose_pool 应不少于 sample_num 组（默认按顺序执行前 sample_num 组）。
# - arm_id 固定 1（右臂），mode 固定 TO_HAND。
action_sequencenum: 1
action_sequence1:
  - action_type: auto_calibrate
    delay_ms: 0                      # 执行前延迟时间（毫秒），0 表示不延迟
    params:
      camera_id: 0
      arm_id: 1                      # 1 = 右臂
      mode: "TO_HAND"
      sample_num: 12                 # 按顺序从位姿池取前 12 组
      # 可选：7 个关节名；省略时按 arm_id 自动取默认名（右臂 Joint1_R..Joint7_R / 左臂 Joint1_L..Joint7_L）
      # joint_name: ["Joint1_R","Joint2_R","Joint3_R","Joint4_R","Joint5_R","Joint6_R","Joint7_R"]
      enable_collision_check: false      # 自碰撞检测（自动标定流程下默认关闭；需要时可改为 true）
      speed: 0.2                         # 移动速度 0~1
      move_timeout_ms: 15000             # 单次 move_joints 超时（毫秒）
      capture_timeout_ms: 60000          # 单次 CHECK_STATUS / TRIGGER_CAPTURE 超时（毫秒）
      timeout_ms: 600000                 # 整体 / EXECUTE_CALIBRATION 超时（毫秒）
      # 头部电机配置（可选）：自动标定开始时先将头部 move_joints 到指定位置，
      # 用于把头部相机调整到标定所需的朝向；head_move_enable=false 时跳过该步骤。
      # head_position 单位 rad，顺序与 head_joint_name 一一对应；
      # 省略 head_joint_name 时回退默认 ["head_yaw_joint","head_pitch_joint"]。
      head_move_enable: false
      head_joint_name: ["head_yaw_joint", "head_pitch_joint"]
      head_position: [0.0037694540806114674, -0.1886483132839203]
      head_speed: 0.2                    # 头部移动速度 0~1
      head_move_timeout_ms: 15000        # 头部 move_joints 单次超时（毫秒）
      # 到位稳定等待：每次 move_joints 到位后先等待 post_move_delay_ms 毫秒，
      # 再触发 TRIGGER_CAPTURE 采集（等待机械臂停止振动），0 表示不等待
      post_move_delay_ms: 10000
      # 关节角池
      pose_pool:
        - [-0.7892131416589868, -1.3266169453999295, 1.450264452177055, -2.047262477420973, -1.3250476777276001, 0.8615498566086918, 1.0194923534813671]
        - [-0.5316001099353874, -1.5120950632054246, 0.9997169842279565, -1.357123722002896, -0.8966061113018409, 0.511638785458862, 0.6706752423283147]
