# ds485_node 配置（自制夹爪，德晟 485 舵机）
# 角度单位：度；速度单位：度/秒；时间单位：毫秒
# 修改后无需重新编译：launch 时用 config:=/路径/xxx.yaml 指定，或改 install 目录下的副本后重启节点
ds485_node:
  ros__parameters:
    # ---------------- 全局 ----------------
    marvin_ip: "192.168.1.190"   # 机械臂控制器 IP（与运控相同）
    state_rate_hz: 10.0          # ds485/state 发布频率；0 关闭周期状态发布，健康监测继续
    poll_ms: 20                  # 旧接口兼容，轨迹周期由 gripper_safety.yaml 决定
    default_timeout_ms: 10000    # 命令 timeout_ms=0 时使用
    allow_raw_write: false       # 是否启用 ds485/servo/write_register 维护写入（调试用，默认关闭）

    # ---------------- 左夹爪 ----------------
    left:
      enabled: false
      # 总线：marvin = 机械臂末端透传；serial = USB-485 串口（台架调试）
      port_type: "marvin"
      arm: "A"                   # A = 左臂
      channel: 2                 # 末端通道：1 CANFD，2 COM1，3 COM2（舵机接在 COM1）
      serial_device: "/dev/ttyUSB0"   # 仅 port_type=serial 时使用
      serial_baud: 115200
      # 本侧从站（同一总线）。二选一：
      #   servo_ids: [1, 2]               明确列出 ID
      #   servo_count: 2 + servo_id: 1    从 servo_id 起连续编号
      # 都不写时为 servo_id 单台。position 模式每侧只支持 1 台；多台须 control:=torque。
      # 不要写成空列表 []，ROS 参数文件无法推断空数组类型；单台时删去 servo_ids 行。
      servo_id: 1
      servo_ids: [1, 2]
      servo_directions: [-1, 1]   # 每台 PWM 符号；镜像安装的一台填 -1，使同一请求同向夹持
      # 同一侧同时启动的方式（仅多台生效，单台总是普通写并校验应答）：
      #   multi_id   0x83 一帧携带各台 PWM，所有舵机同时执行，无应答（默认，最同步）
      #   staged     0x04 逐台预存后广播 0x84 同时执行，无应答
      #   sequential 0x03 逐台写入并等应答，相邻舵机相差约一次往返
      sync_write: "multi_id"
      start_confirm_ms: 200      # 同步帧无应答：此时间内且至少两轮反馈后须读到每台同向非零 PWM，否则整侧停止
                                 # multi_id/staged 多台时不小于 50；只有 sequential 可填 0 关闭
      gap_ms: 10                 # 每次发送前间隔（半双工总线切换时间）；一侧多台时不小于 2
      timeout_ms: 300            # 单次应答超时

      # 0x04=0 时舵机会保存保护参数。启动只写差异。-1 保留字段现值。0x32 沿用舵机配置。
      protection:
        auto_recover: true       # 0x33 低四位清零。异常消失后，下一条新运动指令可触发解除
        voltage_high_v: 30       # 0x3C 高压 / 低压，单位 V，检测固定 3 秒
        voltage_low_v: 5
        temperature_trip_c: 60   # 0x3D 温度，单位 ℃，检测固定 3 秒
        temperature_hysteresis_c: 5  # 降到 60 - 5 = 55 ℃ 可解除
        current_ma: 4800         # 0x3E 电流与检测时间，时间以 100 ms 为一格
        current_detect_ms: 200
        stall_pwm: 600           # 0x3F 堵转/过载检测 PWM，范围 0~1000
        stall_detect_ms: 3000

      # 夹爪标定：position 0 对应 open_deg，255 对应 close_deg（当前设备端点；早期 +30° 往返只验证部分行程）
      open_deg: 0.2
      close_deg: 98.1 
      default_pwm: 1000          # torque=0 时的 PWM 上限 1~1000，1000 = 最大扭矩
      max_speed: 0               # speed=255 对应速度；0 = 舵机速度上限 0x5D（最大速度）
      default_speed: 0           # speed=0 时的速度；0 = 最大速度
      tolerance_deg: 1.0         # 到位容差
      still_band_deg: 0.3        # 角度变化不超过该值视为“不动”
      blocked_samples: 10        # 旧 C++ 接口兼容参数

    # ---------------- 右夹爪 ----------------
    right:
      enabled: true
      port_type: "marvin"
      arm: "B"                   # B = 右臂
      channel: 2
      serial_device: "/dev/ttyUSB1"
      serial_baud: 115200
      servo_id: 1
      servo_ids: [1, 2]
      servo_directions: [1, 1]
      sync_write: "multi_id"
      start_confirm_ms: 200
      gap_ms: 10
      timeout_ms: 300

      # 右侧阈值尚未实测。可逐项填写，其余字段沿用该侧舵机现值。
      protection:
        auto_recover: true
        voltage_high_v: -1
        voltage_low_v: -1
        temperature_trip_c: -1
        temperature_hysteresis_c: -1
        current_ma: -1
        current_detect_ms: -1
        stall_pwm: -1
        stall_detect_ms: -1

      open_deg: 57.9
      close_deg: 167.6 
      default_pwm: 1000
      max_speed: 0
      default_speed: 0
      tolerance_deg: 1.0
      still_band_deg: 0.3
      blocked_samples: 10
